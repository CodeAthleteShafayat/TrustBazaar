<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f2" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="TrustBazaar — a P2P marketplace with escrow, a Trust Score for every user, and rental support. Buy, sell, exchange, and rent with confidence." />
    <meta property="og:title" content="TrustBazaar — Buy. Sell. Exchange. Rent. Trust." />
    <meta property="og:description" content="P2P marketplace with built-in escrow and a Trust Score that rewards reliability." />
    <meta property="og:type" content="website" />
    <title>TrustBazaar — Buy. Sell. Exchange. Rent. Trust.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Warm cream brand background so first paint matches the app
         before React mounts (no white flash). */
      html, body { background: #fbf7f2; color: #1f1c19; margin: 0; }
      .bootsplash {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bootsplash" aria-hidden="true">
        <div style="display:flex;align-items:center;gap:.75rem;">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#f97316,#f43f5e);box-shadow:0 10px 30px rgba(249,115,22,.35);"></div>
          <div style="font-weight:700;letter-spacing:-.01em;color:#1f1c19;">TrustBazaar</div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui;text-align:center;">
        <h1>JavaScript is required</h1>
        <p>TrustBazaar is a single-page app. Please enable JavaScript to continue.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
